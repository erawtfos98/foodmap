<title>Foodies Table Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<!--HEAD-->
<style>
/* Layout: one-screen app. List rail on the left, map filling the rest; stacks map-over-list on phones. */
:root {
  --water: #cfe3ea;
  --land: #f3f1e8;
  --coast: #9fbcc6;
  --bg: #fbfbf8;
  --panel: #ffffff;
  --fg: #1d2a2e;
  --muted: #5f6f74;
  --line: #e3e6e2;
  --accent: #d2402b;
  --accent-ink: #ffffff;
  --chip: #eef2f1;
  --shadow: rgba(20, 30, 32, .28);
  --c-asian: #d2402b;
  --c-feast: #b7791f;
  --c-sweet: #c2477e;
  --c-cafe: #6b5bd2;
  --c-other: #2f7d6d;
  --font-display: "Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --water: #0f2229; --land: #1f2a2b; --coast: #34525b;
    --bg: #121a1c; --panel: #172124; --fg: #e8eeec; --muted: #9db0b2; --line: #2a3a3d;
    --accent: #ff6a50; --accent-ink: #1a0f0c; --chip: #223033; --shadow: rgba(0, 0, 0, .6);
    --c-asian: #ff6a50; --c-feast: #e6a83c; --c-sweet: #ee77ab; --c-cafe: #9d90ff; --c-other: #4fbfa6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --water: #0f2229; --land: #1f2a2b; --coast: #34525b;
  --bg: #121a1c; --panel: #172124; --fg: #e8eeec; --muted: #9db0b2; --line: #2a3a3d;
  --accent: #ff6a50; --accent-ink: #1a0f0c; --chip: #223033; --shadow: rgba(0, 0, 0, .6);
  --c-asian: #ff6a50; --c-feast: #e6a83c; --c-sweet: #ee77ab; --c-cafe: #9d90ff; --c-other: #4fbfa6;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.45 var(--font-body);
  display: flex; overflow: hidden;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#rail {
  width: 380px; flex: none; display: flex; flex-direction: column; min-width: 0;
  background: var(--panel); border-right: 1px solid var(--line);
}
.head { padding: 20px 20px 14px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.eyebrow { font: 500 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 800 28px/1.05 var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); font-size: 14px; }
.lede a { color: var(--fg); text-decoration-color: var(--accent); text-underline-offset: 2px; }
#q {
  width: 100%; box-sizing: border-box; padding: 9px 12px; font: inherit; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
}
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button {
  flex: 1; font: 500 13px/1 var(--font-body); color: var(--fg); background: transparent;
  border: 0; padding: 8px 6px; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--panel); }
#chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font: 500 12px/1 var(--font-body); color: var(--fg);
  background: var(--chip); border: 1px solid transparent; border-radius: 999px; padding: 6px 10px; cursor: pointer;
  flex: none; white-space: nowrap;
}
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--muted)); }
.chip b { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: var(--fg); }
.count { font: 400 12px/1 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

#list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; }
#list li + li { border-top: 1px solid var(--line); }
#list button {
  all: unset; box-sizing: border-box; width: 100%; cursor: pointer;
  display: grid; grid-template-columns: 48px 1fr; gap: 2px 12px; padding: 12px 20px; align-items: start;
}
#list button:hover, #list button[aria-current="true"] { background: var(--chip); }
#list button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.thumb {
  grid-row: span 3; width: 48px; aspect-ratio: 3 / 4; border-radius: 6px; overflow: hidden; position: relative;
  background: var(--dot); display: grid; place-items: center;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .n { font: 500 12px/1 var(--font-mono); color: var(--panel); font-variant-numeric: tabular-nums; }
.thumb .n.on-img {
  position: absolute; left: 3px; top: 3px; padding: 2px 4px; border-radius: 4px;
  background: var(--dot); font-size: 10px;
}
.pname { font-weight: 600; min-width: 0; }
.psub { font-size: 13px; color: var(--muted); min-width: 0; }
.pnote { font-size: 13px; min-width: 0; }
.badge { font: 500 10px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; margin-left: 4px; vertical-align: 1px; }

details.unmapped { border-top: 1px solid var(--line); padding: 12px 20px 16px; font-size: 13px; max-height: 40%; overflow-y: auto; }
details.unmapped summary { cursor: pointer; color: var(--muted); }
details.unmapped ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; }

#map { flex: 1; min-width: 0; height: 100%; background: var(--water); }
.leaflet-container { font: inherit; background: var(--water); }
.land { fill: var(--land); fill-opacity: 1; stroke: var(--coast); stroke-width: 1; }
.suburb {
  font: 500 10px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); white-space: nowrap; pointer-events: none; text-align: center;
}
.pin {
  width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
  background: var(--dot); border: 2px solid var(--panel); box-shadow: 0 1px 4px var(--shadow);
  display: grid; place-items: center; box-sizing: border-box;
}
.pin span { transform: rotate(45deg); font: 500 10px/1 var(--font-mono); color: var(--panel); }

/* Hover preview */
.leaflet-tooltip.peek {
  padding: 0; border: 0; border-radius: 10px; overflow: hidden; width: 128px;
  background: var(--panel); color: var(--fg); box-shadow: 0 6px 20px var(--shadow); white-space: normal;
}
.leaflet-tooltip.peek::before { display: none; }
.peek .pic { aspect-ratio: 9 / 14; background: var(--dot); display: grid; place-items: center; position: relative; }
.peek .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.peek .pic .ph { font: 500 11px/1.3 var(--font-mono); color: var(--panel); text-align: center; padding: 10px; display: grid; gap: 6px; justify-items: center; }
.peek .pic .ph svg { width: 26px; height: 26px; fill: currentColor; }
.peek .plat { position: absolute; right: 6px; bottom: 6px; font: 500 10px/1 var(--font-mono); background: rgba(0,0,0,.6); color: #fff; padding: 3px 5px; border-radius: 4px; }
.peek .cap { padding: 8px 10px 10px; font: 600 12px/1.25 var(--font-body); }

.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--fg); border-radius: 10px; }
.leaflet-popup-content { margin: 14px 16px; width: 250px !important; }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
.pop { display: grid; gap: 6px; }
.pop h2 { margin: 0; font: 800 17px/1.15 var(--font-display); text-wrap: balance; }
.pop .addr { font: 400 12px/1.4 var(--font-mono); color: var(--muted); }
.pop .tag { justify-self: start; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--chip); }
.pop .tag i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--dot); margin-right: 5px; }
.pop p { margin: 0; font-size: 13px; }
.pop .vid { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; text-decoration: none; }
.pop .vid .pic { aspect-ratio: 9 / 14; border-radius: 6px; overflow: hidden; background: var(--dot); display: grid; place-items: center; }
.pop .vid .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pop .vid .pic svg { width: 18px; height: 18px; fill: var(--panel); }
.pop .vid span { font-size: 12px; color: var(--muted); }
.pop .watch {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 12px; border-radius: 8px; background: var(--accent); color: var(--accent-ink) !important;
  font-weight: 600; text-decoration: none;
}
.pop .watch svg { width: 14px; height: 14px; fill: currentColor; }
.pop .more { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.pop .dir { font-size: 13px; text-align: center; }
.leaflet-control-attribution { background: var(--panel) !important; color: var(--muted); }
.leaflet-control-attribution a { color: var(--muted); }
.leaflet-bar a { background: var(--panel); color: var(--fg); border-color: var(--line); }

@media (max-width: 760px) {
  body { flex-direction: column; overflow: auto; }
  #map { order: -1; flex: none; height: 52%; min-height: 300px; }
  #rail { width: 100%; border-right: 0; border-top: 1px solid var(--line); flex: 1 0 auto; }
  .head { padding: 16px; }
  #list button { padding: 12px 16px; }
  details.unmapped { padding: 12px 16px 16px; max-height: none; }
  #list { overflow: visible; }
}
@media (prefers-reduced-motion: reduce) { .leaflet-zoom-anim .leaflet-zoom-animated { transition: none !important; } }
</style>

<aside id="rail">
  <div class="head">
    <div class="eyebrow">Aotearoa · New Zealand</div>
    <h1>Foodies Table Map</h1>
    <p class="lede">Food spots from
      <a href="https://www.youtube.com/@VanessaandAnthony/shorts" target="_blank" rel="noopener">Vanessa &amp; Anthony</a>
      on YouTube and <a href="https://www.tiktok.com/@foodiestablenz" target="_blank" rel="noopener">TikTok</a>.
      Hover or tap a pin to see the video.</p>
    <div class="seg" id="region" role="group" aria-label="Region">
      <button type="button" data-r="Auckland" aria-pressed="true">Auckland</button>
      <button type="button" data-r="NZ" aria-pressed="false">Rest of NZ</button>
      <button type="button" data-r="" aria-pressed="false">All</button>
    </div>
    <label class="eyebrow" for="q">Search</label>
    <input id="q" type="search" placeholder="Dumplings, Albany, buffet…" autocomplete="off">
    <div id="chips" role="group" aria-label="Filter by food type"></div>
    <div class="count" id="count" aria-live="polite"></div>
  </div>
  <ul id="list"></ul>
  <details class="unmapped">
    <summary>Videos without a single address (<span id="ucount"></span>)</summary>
    <ul id="unmapped"></ul>
  </details>
</aside>
<div id="map" role="region" aria-label="Map of food spots"></div>

<!--SCRIPTS-->
<script>
(function () {
  'use strict';
  var CFG = window.MAP_CONFIG || {};
  var THUMBS = {};
  (window.THUMBS || []).forEach(function (k) { THUMBS[k] = true; });

  var GROUP = {
    'Chinese': '--c-asian', 'Hotpot & BBQ': '--c-asian', 'Korean': '--c-asian', 'Japanese': '--c-asian',
    'Thai & Vietnamese': '--c-asian', 'Malaysian': '--c-asian', 'Indian & Middle Eastern': '--c-feast',
    'Buffet': '--c-feast', 'Burgers & chicken': '--c-feast', 'Steak & fine dining': '--c-feast', 'Seafood': '--c-feast',
    'Pizza & Italian': '--c-feast', 'Mexican': '--c-feast',
    'Cafe & brunch': '--c-cafe', 'Bakery & pies': '--c-cafe',
    'Dessert & drinks': '--c-sweet'
  };
  function colorVar(c) { return 'var(' + (GROUP[c] || '--c-other') + ')'; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function videoUrl(v) {
    return v.p === 'yt' ? 'https://www.youtube.com/shorts/' + encodeURIComponent(v.id)
                        : 'https://www.tiktok.com/@foodiestablenz/video/' + encodeURIComponent(v.id);
  }
  function platform(v) { return v.p === 'yt' ? 'YouTube' : 'TikTok'; }
  // Saved thumbnail first; in the repo build, YouTube can also be loaded straight from YouTube.
  function thumbUrl(v) {
    if (THUMBS[v.p + '-' + v.id]) return 'thumbs/' + v.p + '-' + v.id + '.jpg';
    if (CFG.remoteYouTubeThumbs && v.p === 'yt') return 'https://i.ytimg.com/vi/' + encodeURIComponent(v.id) + '/hqdefault.jpg';
    return null;
  }
  function img(src) { return '<img src="' + esc(src) + '" alt="" loading="lazy" onerror="this.remove()">'; }
  function mapsUrl(p) { return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.name + ', ' + p.address); }
  var PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>';

  var places = window.PLACES.map(function (p, i) {
    p.n = i + 1;
    p.region = p.region || 'Auckland';
    p.home = p.region === 'Auckland' ? 'Auckland' : 'NZ';
    p.v = p.videos[0];
    // Prefer a video that has a picture for the preview.
    p.pv = p.videos.filter(thumbUrl)[0] || p.v;
    return p;
  });

  var map = L.map('map', { zoomSnap: 0.5, minZoom: 5, maxZoom: CFG.tiles ? 18 : 15 });
  if (CFG.tiles) {
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19, subdomains: 'abcd',
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
    }).addTo(map);
  } else {
    map.attributionControl.setPrefix('').addAttribution('Coastline © OpenStreetMap contributors');
    L.geoJSON(window.LAND, { style: { className: 'land' }, interactive: false }).addTo(map);
    var labels = L.layerGroup();
    [['Auckland CBD', -36.8445, 174.7700], ['Albany', -36.7290, 174.6980], ['New Lynn', -36.9110, 174.6700],
     ['Westgate', -36.8120, 174.6200], ['Mt Eden', -36.8870, 174.7560], ['Newmarket', -36.8650, 174.7900],
     ['Panmure', -36.8930, 174.8650], ['Botany', -36.9330, 174.9150], ['Ōtāhuhu', -36.9520, 174.8360],
     ['Takapuna', -36.7880, 174.7780], ['Manukau', -36.9930, 174.8800], ['Henderson', -36.8840, 174.6250],
     ['Rosedale', -36.7600, 174.7150], ['Papatoetoe', -36.9800, 174.8650], ['Remuera', -36.8830, 174.8000],
     ['Ponsonby', -36.8520, 174.7380], ['Takanini', -37.0480, 174.9300], ['Birkenhead', -36.8060, 174.7200]]
    .forEach(function (s) {
      labels.addLayer(L.marker([s[1], s[2]], { interactive: false, keyboard: false,
        icon: L.divIcon({ className: 'suburb', html: s[0], iconSize: [110, 12], iconAnchor: [55, 6] }) }));
    });
    // Suburb names only make sense once zoomed into Auckland.
    function toggleLabels() { if (map.getZoom() >= 11) labels.addTo(map); else labels.remove(); }
    map.on('zoomend', toggleLabels);
    map.whenReady(toggleLabels);
  }

  function picHtml(v, placeholder) {
    var t = thumbUrl(v);
    return t ? img(t) : placeholder;
  }

  function peekHtml(p) {
    return '<div style="--dot:' + colorVar(p.cat) + '"><div class="pic">' +
      picHtml(p.pv, '<span class="ph">' + PLAY + platform(p.pv) + ' video</span>') +
      '<span class="plat">' + platform(p.pv) + '</span></div>' +
      '<div class="cap">' + esc(p.name) + '</div></div>';
  }

  function popupHtml(p) {
    var more = p.videos.slice(1).map(function (v, i) {
      return '<a href="' + videoUrl(v) + '" target="_blank" rel="noopener">' + platform(v) + ' video ' + (i + 2) + '</a>';
    }).join('');
    return '<div class="pop" style="--dot:' + colorVar(p.cat) + '">' +
      '<span class="tag"><i></i>' + esc(p.cat) + (p.ad ? ' · sponsored' : '') + '</span>' +
      '<h2>' + esc(p.name) + '</h2>' +
      '<div class="addr">' + esc(p.address) + '</div>' +
      (p.notes ? '<p>' + esc(p.notes) + '</p>' : '') +
      '<a class="vid" href="' + videoUrl(p.pv) + '" target="_blank" rel="noopener">' +
        '<span class="pic">' + picHtml(p.pv, PLAY) + '</span>' +
        '<span>' + esc(p.pv.t || 'Their ' + platform(p.pv) + ' video about ' + p.name) + '</span></a>' +
      '<a class="watch" href="' + videoUrl(p.v) + '" target="_blank" rel="noopener">' + PLAY + 'Watch on ' + platform(p.v) + '</a>' +
      (more ? '<div class="more">More: ' + more + '</div>' : '') +
      '<a class="dir" href="' + mapsUrl(p) + '" target="_blank" rel="noopener">Directions in Google Maps</a>' +
    '</div>';
  }

  var hover = window.matchMedia('(hover: hover)').matches;
  places.forEach(function (p) {
    p.marker = L.marker([p.lat, p.lng], {
      title: p.name, riseOnHover: true,
      icon: L.divIcon({ className: '', iconSize: [26, 26], iconAnchor: [13, 28], popupAnchor: [0, -26], tooltipAnchor: [0, -30],
        html: '<div class="pin" style="--dot:' + colorVar(p.cat) + '"><span>' + p.n + '</span></div>' })
    }).bindPopup(popupHtml(p), { maxWidth: 282, autoPanPadding: [24, 24] });
    if (hover) p.marker.bindTooltip(peekHtml(p), { className: 'peek', direction: 'top', offset: [0, 0], opacity: 1 });
    p.marker.on('popupopen', function () { p.marker.closeTooltip(); select(p); });
    p.hay = [p.name, p.address, p.area, p.region, p.cat, p.notes].concat(p.videos.map(function (v) { return v.t; })).join(' ').toLowerCase();
  });

  var layer = L.layerGroup().addTo(map);
  var state = { region: 'Auckland', cat: null };
  var listEl = document.getElementById('list'), qEl = document.getElementById('q'),
      countEl = document.getElementById('count'), chipsEl = document.getElementById('chips');
  var current = null;

  function inRegion(p) { return !state.region || p.home === state.region; }

  function buildChips() {
    var counts = {};
    places.filter(inRegion).forEach(function (p) { counts[p.cat] = (counts[p.cat] || 0) + 1; });
    if (state.cat && !counts[state.cat]) state.cat = null;
    var cats = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b); });
    chipsEl.innerHTML = '';
    [null].concat(cats).forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip';
      b.setAttribute('aria-pressed', String(state.cat === c));
      if (c === null) b.textContent = 'All types';
      else { b.style.setProperty('--dot', colorVar(c)); b.innerHTML = '<i></i>' + esc(c) + ' <b>' + counts[c] + '</b>'; }
      b.addEventListener('click', function () { state.cat = c; buildChips(); render(true); });
      chipsEl.appendChild(b);
    });
  }

  function select(p) {
    current = p;
    listEl.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-current', String(+b.dataset.n === p.n)); });
  }

  function render(fit) {
    var q = qEl.value.trim().toLowerCase();
    var shown = places.filter(function (p) {
      return inRegion(p) && (!state.cat || p.cat === state.cat) && (!q || p.hay.indexOf(q) !== -1);
    });
    layer.clearLayers();
    shown.forEach(function (p) { layer.addLayer(p.marker); });
    listEl.innerHTML = '';
    shown.forEach(function (p) {
      var li = document.createElement('li');
      var t = thumbUrl(p.pv);
      li.innerHTML = '<button type="button" data-n="' + p.n + '" style="--dot:' + colorVar(p.cat) + '">' +
        '<span class="thumb">' + (t ? img(t) + '<span class="n on-img">' + p.n + '</span>' : '<span class="n">' + p.n + '</span>') + '</span>' +
        '<span class="pname">' + esc(p.name) + (p.ad ? '<span class="badge">Ad</span>' : '') + '</span>' +
        '<span class="psub">' + esc(p.cat) + ' · ' + esc(p.area) + ' · ' + p.videos.map(platform).filter(function (x, i, a) { return a.indexOf(x) === i; }).join(' + ') + '</span>' +
        '<span class="pnote">' + esc(p.notes || '') + '</span></button>';
      var btn = li.firstChild;
      btn.addEventListener('click', function () {
        if (window.matchMedia('(max-width: 760px)').matches) document.getElementById('map').scrollIntoView({ behavior: 'smooth' });
        map.flyTo([p.lat, p.lng], Math.max(map.getZoom(), CFG.tiles ? 15 : 13), { duration: 0.6 });
        map.once('moveend', function () { p.marker.openPopup(); });
      });
      if (hover) {
        btn.addEventListener('mouseenter', function () { if (map.getBounds().contains(p.marker.getLatLng())) p.marker.openTooltip(); });
        btn.addEventListener('mouseleave', function () { p.marker.closeTooltip(); });
      }
      listEl.appendChild(li);
    });
    var total = places.filter(inRegion).length;
    countEl.textContent = shown.length === total ? total + ' places' : shown.length + ' of ' + total + ' places';
    if (!shown.length) listEl.innerHTML = '<li style="padding:16px 20px;color:var(--muted)">No places match. Try another word or pick All types.</li>';
    if (current) select(current);
    if (fit && shown.length) {
      map.flyToBounds(L.latLngBounds(shown.map(function (p) { return [p.lat, p.lng]; })).pad(0.15), { maxZoom: 13, duration: 0.6 });
    }
  }

  document.querySelectorAll('#region button').forEach(function (b) {
    b.addEventListener('click', function () {
      state.region = b.dataset.r;
      document.querySelectorAll('#region button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      buildChips(); render(true);
    });
  });
  qEl.addEventListener('input', function () { render(false); });

  var um = document.getElementById('unmapped');
  window.UNMAPPED.forEach(function (v) {
    var li = document.createElement('li');
    li.innerHTML = '<a href="' + videoUrl(v) + '" target="_blank" rel="noopener">' + esc(v.t) + '</a> <span class="badge">' + platform(v) + '</span>';
    um.appendChild(li);
  });
  document.getElementById('ucount').textContent = window.UNMAPPED.length;

  map.fitBounds(L.latLngBounds(places.filter(inRegion).map(function (p) { return [p.lat, p.lng]; })).pad(0.05));
  buildChips();
  render(false);
})();
</script>
